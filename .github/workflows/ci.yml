name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.17.0
  TF_IN_AUTOMATION: "1"
  TF_INPUT: "0"
  TF_PLUGIN_CACHE_DIR: /home/runner/.terraform.d/plugin-cache
  CHECKOV_IMAGE: bridgecrew/checkov:3.3.30@sha256:4b65e89f1fde292249fc0aa0d0db43302c036dfe39f7370b2d3517571082b894
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  # Last LocalStack Community release that runs without an auth token.
  LOCALSTACK_IMAGE: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a

jobs:
  static:
    name: fmt / validate / docs / tflint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install tflint and terraform-docs
        run: scripts/install-tools.sh tflint terraform-docs

      - name: actionlint (workflow syntax, expressions and shellcheck)
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform validate (every root, module, example and fixture)
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          count=0
          while read -r dir; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -no-color >/dev/null
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
            count=$((count + 1))
          done < <(find . -name '*.tf' -not -path '*/.terraform/*' -printf '%h\n' | sort -u)
          echo "Validated $count Terraform directories" >> "$GITHUB_STEP_SUMMARY"

      - name: Environment drift guard (shared files must be identical)
        run: |
          for f in main.tf variables.tf outputs.tf providers.tf versions.tf .terraform.lock.hcl; do
            for env in staging prod; do
              diff -u "live/dev/$f" "live/$env/$f"
            done
          done
          echo "live/{dev,staging,prod} differ only in terraform.tfvars" >> "$GITHUB_STEP_SUMMARY"

      - name: terraform-docs up to date
        run: |
          for m in modules/*/; do
            terraform-docs -c .terraform-docs.yml "$m" >/dev/null
          done
          git diff --exit-code -- 'modules/*/README.md' || {
            echo "::error::Module READMEs are stale. Run 'make docs' and commit the result."
            exit 1
          }

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init
          tflint --recursive --format compact

  unit-tests:
    name: unit tests (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [vpc, s3-secure-bucket, rds-postgres, ecs-fargate, iam-github-oidc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform test (mocked provider)
        working-directory: modules/${{ matrix.module }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -backend=false -test-directory=tests/unit -no-color >/dev/null
          terraform test -test-directory=tests/unit -no-color | tee test.log
          echo "**${{ matrix.module }}** (mocked): $(tail -n 1 test.log)" >> "$GITHUB_STEP_SUMMARY"

  policy-tests:
    name: policy unit tests (opa)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install opa and conftest
        run: scripts/install-tools.sh opa conftest

      - name: opa fmt / check / test
        run: |
          opa fmt --list --fail policies
          opa check --strict policies
          opa test policies -v | tee opa.log
          {
            echo "### Policy unit tests"
            echo ""
            echo "$(grep -E '^(PASS|FAIL):' opa.log | tail -n 2 | paste -sd ' ')"
            echo ""
            echo "Deny rules per package:"
            echo ""
            for f in policies/terraform/*.rego; do
              case "$f" in *_test.rego|*/lib.rego) continue ;; esac
              echo "- \`$(basename "$f" .rego)\`: $(grep -c '^deny contains' "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  checkov:
    name: checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkov scan
        id: checkov
        run: |
          mkdir -p results
          docker run --rm -v "$PWD:/src" -w /src "$CHECKOV_IMAGE" \
            -d . --config-file .checkov.yaml \
            --output cli --output sarif --output-file-path console,results

      - name: Upload SARIF
        if: always() && steps.checkov.outcome != 'skipped' && hashFiles('results/results_sarif.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results/results_sarif.sarif
          category: checkov

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (full history)
        id: gitleaks
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" "$GITLEAKS_IMAGE" \
            git /repo --redact --exit-code 1 \
            --report-format sarif --report-path /repo/gitleaks.sarif

      - name: Upload SARIF
        if: always() && steps.gitleaks.outcome != 'skipped' && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  integration:
    name: integration (${{ matrix.target }}, LocalStack)
    needs: [static, unit-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [modules/vpc, modules/s3-secure-bucket, modules/iam-github-oidc, bootstrap]
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Start LocalStack
        run: scripts/start-localstack.sh

      - name: terraform test (apply, assert, destroy)
        working-directory: ${{ matrix.target }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          terraform init -backend=false -test-directory=tests/integration -no-color >/dev/null
          terraform test -test-directory=tests/integration -verbose -no-color | tee test.log
          echo "**${{ matrix.target }}** (LocalStack apply + destroy): $(tail -n 1 test.log)" >> "$GITHUB_STEP_SUMMARY"

      - name: Nothing left behind after destroy
        run: |
          leftovers=$(docker exec localstack sh -c 'awslocal ec2 describe-vpcs --query "Vpcs[?IsDefault==\`false\`].VpcId" --output text; awslocal s3api list-buckets --query "Buckets[].Name" --output text; awslocal iam list-roles --query "Roles[].RoleName" --output text; awslocal dynamodb list-tables --query "TableNames" --output text')
          echo "Leftovers: '${leftovers}'"
          test -z "$(echo "$leftovers" | tr -d '[:space:]')"

      - name: LocalStack logs
        if: failure()
        run: docker logs localstack 2>&1 | tail -n 200

  plan:
    name: plan (${{ matrix.environment }})
    needs: [static]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, staging, prod]
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install conftest
        run: scripts/install-tools.sh conftest

      - name: Start LocalStack
        run: scripts/start-localstack.sh

      - name: terraform plan
        working-directory: live/${{ matrix.environment }}
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          ../../scripts/localstack-override.sh .
          terraform init -no-color >/dev/null
          terraform plan -refresh=false -lock=false -no-color -out=tfplan > plan.txt
          tail -n 3 plan.txt
          terraform show -json tfplan > plan.json

      - name: Plan summary
        run: |
          scripts/plan-summary.sh "live/${{ matrix.environment }}/plan.json" "Plan: ${{ matrix.environment }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Conftest (OPA policies on the plan)
        working-directory: live/${{ matrix.environment }}
        run: |
          conftest test plan.json -p ../../policies --all-namespaces --no-color | tee conftest.log
          echo "Conftest on ${{ matrix.environment }}: $(tail -n 1 conftest.log)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan-${{ matrix.environment }}
          path: |
            live/${{ matrix.environment }}/plan.txt
            live/${{ matrix.environment }}/plan.json
          retention-days: 14

  policy-negative:
    name: policies reject an insecure plan
    needs: [static, policy-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install conftest
        run: scripts/install-tools.sh conftest

      - name: Start LocalStack
        run: scripts/start-localstack.sh

      - name: Plan the insecure fixture
        working-directory: tests/policy-fixtures/insecure
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          ../../../scripts/localstack-override.sh .
          terraform init -backend=false -no-color >/dev/null
          terraform plan -refresh=false -lock=false -no-color -out=tfplan >/dev/null
          terraform show -json tfplan > plan.json

      - name: Conftest must fail with every expected violation
        working-directory: tests/policy-fixtures/insecure
        run: |
          if conftest test plan.json -p ../../../policies --all-namespaces --no-color > conftest.log; then
            echo "::error::Conftest accepted an insecure plan"
            exit 1
          fi
          cat conftest.log
          missing=0
          while IFS= read -r expected; do
            [ -z "$expected" ] && continue
            grep -qF -- "$expected" conftest.log || { echo "::error::missing violation: $expected"; missing=1; }
          done < expected-violations.txt
          test "$missing" -eq 0
          echo "Insecure fixture: $(grep -c '^FAIL' conftest.log) violations reported, all $(grep -c . expected-violations.txt) expected ones present." >> "$GITHUB_STEP_SUMMARY"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [static, unit-tests, policy-tests, checkov, gitleaks, integration, plan, policy-negative]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || exit 1
          done
